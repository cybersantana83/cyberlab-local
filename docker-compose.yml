###############################################################
# CyberLab Local
# Ambiente de pentest local
#
# USO:
#   docker-compose up -d
#
# ACESSO:
#   DVWA         → http://localhost:8080
#   Juice Shop   → http://localhost:3000
#   WebGoat      → http://localhost:8081/WebGoat
#   Metasploitable → 172.20.0.20 (via Nmap/Metasploit/Kali)
#   Enum Target (SNMP + LDAP) → 172.20.0.21 (via Nmap/snmpwalk/ldapsearch)
#
# PARAR:
#   docker-compose down
#
# ⚠️  ATENÇÃO: ambiente intencionalmente vulnerável.
#     Rode SOMENTE em rede local isolada ou com firewall ativo.
#     NUNCA exponha estas portas na internet.
###############################################################

version: "3.8"

networks:
  lab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  # ── DVWA — Damn Vulnerable Web Application ──────────────────
  # Módulo 2: SQLi, XSS, CSRF, File Upload, Command Injection
  # Acesso: http://localhost:8080
  # Login padrão: admin / password
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: lab-dvwa
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      lab-network:
        ipv4_address: 172.20.0.10
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=dvwa

  # ── Juice Shop — OWASP Top 10 moderno ───────────────────────
  # Módulo 3: Burp Suite, vulnerabilidades web modernas
  # Acesso: http://localhost:3000
  # Crie sua conta na primeira vez que acessar
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: lab-juiceshop
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      lab-network:
        ipv4_address: 172.20.0.11

  # ── WebGoat — Lições interativas OWASP ──────────────────────
  # Módulo 2: aprendizado guiado de vulnerabilidades web
  # Acesso: http://localhost:8081/WebGoat
  # Login padrão: guest / guest
  webgoat:
    image: webgoat/webgoat:latest
    container_name: lab-webgoat
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "9090:9090"
    networks:
      lab-network:
        ipv4_address: 172.20.0.12

  # ── Metasploitable 2 — Alvo de sistema (SMB) ────────────────
  # Módulo 3: Nmap, Metasploit, Hydra, enumeração de serviços
  # Acesso via Nmap: nmap -sV 172.20.0.20
  # Login SSH: msfadmin / msfadmin
  # Serviços: FTP(21), SSH(22), Telnet(23), SMB(445), MySQL(3306)
  metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: lab-metasploitable
    restart: unless-stopped
    tty: true
    networks:
      lab-network:
        ipv4_address: 172.20.0.20
    # ⚠️  Portas NÃO expostas ao host intencionalmente
    # Ataque a partir do Kali local apontando para 172.20.0.20
    # Se precisar expor para testes, descomente abaixo:
    ports:
       - "2222:22"
       - "2121:21"

  # ── Enum Target — SNMP + LDAP ────────────────────────────────
  # Módulo 4: enumeração com enum4linux / snmpwalk / ldapsearch
  # Community SNMP: public (sem restrição de origem)
  # Domínio LDAP:   dc=lab,dc=local
  # Estrutura:      ou=people, ou=groups | grupos admins/devs
  # Usuários:       jsilva, mpereira, rsantos, amoura (senha: temp123)
  # Acesso:
  #   snmpwalk -v2c -c public 172.20.0.21
  #   ldapsearch -x -H ldap://172.20.0.21 -b 'dc=lab,dc=local'
  enum-target:
    image: debian:bookworm-slim
    container_name: lab-enum-target
    restart: unless-stopped
    tty: true
    networks:
      lab-network:
        ipv4_address: 172.20.0.21
    command: |
      bash -c "
      export DEBIAN_FRONTEND=noninteractive;
      apt-get update && apt-get install -y snmpd snmp slapd ldap-utils;

      cat > /etc/snmp/snmpd.conf << 'SNMPCONF'
      rocommunity public
      rocommunity6 public
      sysLocation CyberLab Local
      sysContact admin@lab.local
      SNMPCONF
      pgrep -x snmpd >/dev/null || snmpd -Lsd;

      debconf-set-selections << 'DEBCONF'
      slapd slapd/internal/generated_adminpw password LdapLab2026!
      slapd slapd/internal/adminpw password LdapLab2026!
      slapd slapd/password2 password LdapLab2026!
      slapd slapd/password1 password LdapLab2026!
      slapd slapd/domain string lab.local
      slapd shared/organization string CyberLab Local
      slapd slapd/purge_database boolean true
      slapd slapd/move_old_database boolean true
      slapd slapd/allow_ldap_v2 boolean false
      slapd slapd/no_configuration boolean false
      DEBCONF
      dpkg-reconfigure -f noninteractive slapd;
      pgrep -x slapd >/dev/null || slapd -h 'ldap:/// ldapi:///' -u openldap -g openldap;
      sleep 2;

      cat > /tmp/lab-directory-structure.ldif << 'LDIF'
      dn: ou=people,dc=lab,dc=local
      objectClass: organizationalUnit
      ou: people

      dn: ou=groups,dc=lab,dc=local
      objectClass: organizationalUnit
      ou: groups

      dn: cn=admins,ou=groups,dc=lab,dc=local
      objectClass: posixGroup
      cn: admins
      gidNumber: 5000
      memberUid: jsilva
      memberUid: rsantos

      dn: cn=devs,ou=groups,dc=lab,dc=local
      objectClass: posixGroup
      cn: devs
      gidNumber: 5001
      memberUid: mpereira
      memberUid: amoura

      dn: uid=jsilva,ou=people,dc=lab,dc=local
      objectClass: inetOrgPerson
      objectClass: posixAccount
      uid: jsilva
      cn: Joao Silva
      sn: Silva
      mail: jsilva@lab.local
      telephoneNumber: +55 11 91234-0001
      title: Administrador de TI
      uidNumber: 10001
      gidNumber: 5000
      homeDirectory: /home/jsilva
      userPassword: temp123

      dn: uid=mpereira,ou=people,dc=lab,dc=local
      objectClass: inetOrgPerson
      objectClass: posixAccount
      uid: mpereira
      cn: Mariana Pereira
      sn: Pereira
      mail: mpereira@lab.local
      telephoneNumber: +55 11 91234-0002
      title: Desenvolvedora Backend
      uidNumber: 10002
      gidNumber: 5001
      homeDirectory: /home/mpereira
      userPassword: temp123

      dn: uid=rsantos,ou=people,dc=lab,dc=local
      objectClass: inetOrgPerson
      objectClass: posixAccount
      uid: rsantos
      cn: Rodrigo Santos
      sn: Santos
      mail: rsantos@lab.local
      telephoneNumber: +55 11 91234-0003
      title: Analista de Suporte
      uidNumber: 10003
      gidNumber: 5000
      homeDirectory: /home/rsantos
      userPassword: temp123

      dn: uid=amoura,ou=people,dc=lab,dc=local
      objectClass: inetOrgPerson
      objectClass: posixAccount
      uid: amoura
      cn: Ana Moura
      sn: Moura
      mail: amoura@lab.local
      telephoneNumber: +55 11 91234-0004
      title: Desenvolvedora Frontend
      uidNumber: 10004
      gidNumber: 5001
      homeDirectory: /home/amoura
      userPassword: temp123
      LDIF
      ldapadd -x -D 'cn=admin,dc=lab,dc=local' -w 'LdapLab2026!' -f /tmp/lab-directory-structure.ldif || true;

      touch /tmp/ready;
      tail -f /dev/null
      "

  # ── Kali Linux — Máquina de Ataque ──────────────────────────
  kali:
    image: kalilinux/kali-rolling:latest
    container_name: lab-kali
    restart: unless-stopped
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

    networks:
      lab-network:
        ipv4_address: 172.20.0.5
    command: >
      bash -c "
      echo 'echo \"⏳ Aguarde... Instalação de ferramentas em andamento...\"' >> /root/.bashrc;
      echo 'while [ ! -f /tmp/ready ]; do sleep 1; done' >> /root/.bashrc;
      echo 'clear' >> /root/.bashrc;

      apt-get update && apt-get install -y iputils-ping curl net-tools nmap enum4linux snmp ldap-utils;

      touch /tmp/ready;
      tail -f /dev/null
      "
